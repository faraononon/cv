@let content = i18n.content().hero;

<section id="intro" class="hero" aria-labelledby="hero-title">
  <div class="copy">
    <h1 id="hero-title" class="title">
      <span>{{ content.firstName }} </span>
      <span>{{ content.lastName }}</span>
    </h1>
    <p class="role">{{ content.role }}</p>
    <p class="experience">{{ content.experience }}</p>
    <p class="summary">{{ content.summary }}</p>
    <p class="availability" role="status">
      <span aria-hidden="true"></span>
      {{ content.availability }}
    </p>

    <div class="actions" [attr.aria-label]="content.actionsLabel">
      <a class="action primary" [routerLink]="['/', i18n.locale()]" fragment="selected-work">
        <span>{{ content.viewWork }}</span>
        <span class="action-icon" aria-hidden="true">→</span>
      </a>
      <a class="action secondary" [href]="content.resumeUrl" download>
        <span>{{ content.downloadCv }}</span>
        <span class="action-icon" aria-hidden="true">↓</span>
      </a>
    </div>
  </div>

  <figure class="profile">
    <figcaption>profile.json</figcaption>
    <pre aria-label="Dmitriy Farion profile data"><code><span class="punctuation">&#123;</span>
  <span class="key">"name"</span>: <span class="string">"Dmitriy Farion"</span>,
  <span class="key">"role"</span>: <span class="string">"Angular Frontend Engineer"</span>,
  <span class="key">"location"</span>: <span class="string">"Remote"</span>,
  <span class="key">"experience"</span>: <span class="string">"7+ years"</span>,
  <span class="key">"selectedWork"</span>: <span class="number">3</span>,
  <span class="key">"email"</span>: <span class="string">"farion.dmitri@gmail.com"</span>,
  <span class="key">"messenger"</span>: <span class="string">"Available on request"</span>,
  <span class="key">"status"</span>: <span class="status">"open_to_work"</span>
<span class="punctuation">&#125;</span></code></pre>
  </figure>

  <div class="visual" aria-hidden="true">
    <app-angular-mark />
  </div>
</section>
