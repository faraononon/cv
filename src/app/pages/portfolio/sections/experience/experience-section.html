<section id="selected-work" class="experience-list" aria-labelledby="experience-title">
  <header class="header">
    <div>
      <p class="eyebrow">Selected work</p>
      <h2 id="experience-title">Projects</h2>
    </div>
    <p class="intro">
      Enterprise Angular products shaped through architecture, team leadership, and hands-on delivery.
    </p>
  </header>

  <ol>
    @for (experience of experiences; track experience.slug) {
      <li>
        <app-experience-card [experience]="experience" />
      </li>
    }
  </ol>
</section>
