@let content = i18n.content().experience;

<section id="selected-work" class="experience-list" aria-labelledby="experience-title">
  <header class="header">
    <div>
      <p class="eyebrow">{{ content.eyebrow }}</p>
      <h2 id="experience-title">{{ content.title }}</h2>
    </div>
    <p class="intro">{{ content.intro }}</p>
  </header>

  <ol>
    @for (experience of content.items; track experience.slug) {
      <li>
        <app-experience-card [experience]="experience" />
      </li>
    }
  </ol>
</section>
