<button
  class="scroll-top"
  type="button"
  aria-label="Scroll to top"
  [class.visible]="visible()"
  [attr.aria-hidden]="!visible()"
  [attr.tabindex]="visible() ? 0 : -1"
  (click)="scrollToTop()"
>
  <span>Top</span>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="m6 11 6-6 6 6M12 5v14" />
  </svg>
</button>
